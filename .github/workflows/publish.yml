# Publish to PyPI on a version tag, via Trusted Publishing (no token stored).
#
# One-time setup on pypi.org: Your account -> Publishing -> Add a new pending
# publisher: project "edgecheck", owner "futur3gh0st", repository "edgecheck",
# workflow "publish.yml", environment "pypi". Then:
#
#   git tag v0.2.0 && git push origin v0.2.0
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' build
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # what Trusted Publishing exchanges for a PyPI token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

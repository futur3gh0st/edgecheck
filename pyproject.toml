[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecheck"
version = "0.1.0"
description = "Does your strategy's claimed edge survive contact with reality?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["trading", "backtest", "expectancy", "calibration", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16", "mypy>=1.10"]

[project.scripts]
edgecheck = "edgecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9", "B", "DTZ", "PLE", "I"]

[tool.mypy]
strict = true
files = ["src/edgecheck"]
